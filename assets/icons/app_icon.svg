<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主渐变 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <!-- 白色半透明渐变 -->
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
    </linearGradient>
    
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <!-- 内部发光 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主背景圆形 -->
  <circle cx="256" cy="256" r="220" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- 内层装饰圆环 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>
  
  <!-- 居中的钥匙图标 -->
  <g transform="translate(256, 256)">
    <!-- 钥匙环 -->
    <circle cx="-20" cy="0" r="45" 
            fill="none" 
            stroke="url(#whiteGradient)" 
            stroke-width="18" 
            stroke-linecap="round"
            filter="url(#glow)"/>
    
    <!-- 钥匙环内层 -->
    <circle cx="-20" cy="0" r="25" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="3" 
            opacity="0.6"/>
    
    <!-- 钥匙杆 -->
    <rect x="20" y="-8" width="70" height="16" 
          fill="url(#whiteGradient)" 
          rx="8"
          filter="url(#glow)"/>
    
    <!-- 钥匙杆中心线 -->
    <rect x="20" y="-1" width="70" height="2" 
          fill="#FFFFFF" 
          opacity="0.3"/>
    
    <!-- 钥匙齿 -->
    <rect x="75" y="-3" width="10" height="20" 
          fill="url(#whiteGradient)"
          filter="url(#glow)"/>
    <rect x="67" y="-3" width="6" height="12" 
          fill="url(#whiteGradient)"
          filter="url(#glow)"/>
    
    <!-- 钥匙齿细节 -->
    <rect x="75" y="2" width="10" height="1" 
          fill="#FFFFFF" 
          opacity="0.4"/>
  </g>
  
  <!-- 背景装饰点 -->
  <circle cx="150" cy="150" r="2" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="360" cy="170" r="1.5" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="170" cy="340" r="2" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="340" cy="360" r="1.5" fill="#FFFFFF" opacity="0.2"/>
  
  <!-- 顶部微妙高光 -->
  <ellipse cx="256" cy="150" rx="60" ry="8" fill="#FFFFFF" opacity="0.1"/>
</svg> 